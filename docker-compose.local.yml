services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pushdemo
      POSTGRES_USER: pushdemo
      POSTGRES_PASSWORD: pushdemo-local-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pushdemo -d pushdemo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_local:/var/lib/postgresql/data

  web:
    build: .
    command: ["local"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - vapid_local:/app/keys

volumes:
  postgres_local:
  vapid_local:
