services:
  web:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: pushdemo.settings.local
    command: ["local"]
    network_mode: bridge
    ports:
      - "8000:8000"
    extra_hosts:
      # Linux'ta da host.docker.internal adinin host makineye cozulmesini saglar.
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - vapid_local:/app/keys

volumes:
  vapid_local:
