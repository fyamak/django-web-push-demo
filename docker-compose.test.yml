services:
  web:
    build: .
    container_name: notification_web_test
    environment:
      DJANGO_SETTINGS_MODULE: pushdemo.settings.test
    restart: unless-stopped
    command: ["test"]

    ports:
      - "127.0.0.1:5001:8000"
    volumes:
      - /var/www/platform_farmingo:/app/staticfiles
      - vapid_test:/app/keys
    networks:
      notification:

volumes:
  vapid_test:

networks:
  notification:
    name: notification
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24
          gateway: 172.40.0.1