services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pushdemo
      POSTGRES_USER: pushdemo
      POSTGRES_PASSWORD: pushdemo-test-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pushdemo -d pushdemo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_test:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    command: ["test"]
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - static_test:/app/staticfiles
      - vapid_test:/app/keys

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/active:/etc/nginx/conf.d:ro
      - static_test:/static:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:v5.4.0
    profiles: ["tools"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

volumes:
  postgres_test:
  static_test:
  vapid_test:
  certbot_www:
  certbot_certs:
