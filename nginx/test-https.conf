# LEGACY/UNUSED: testplatform.farmingo.com.tr deployment uses the host Nginx config in /etc/nginx/sites-enabled.
server {
    listen 80;
    server_name 31.97.37.175;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 31.97.37.175;

    ssl_certificate /etc/letsencrypt/live/31.97.37.175/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/31.97.37.175/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    location /static/ {
        alias /static/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
