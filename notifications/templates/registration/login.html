<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/notifications/icons/icon-192.png">
  <title>Giriş - Push Demo</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f3f4f6;margin:0;color:#111827}
    .wrap{max-width:420px;margin:10vh auto;padding:24px}
    .card{background:white;padding:28px;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
    label{display:block;margin:14px 0 6px;font-weight:600} input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
    button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#111827;color:white;font-size:16px;font-weight:700;cursor:pointer}
    .errorlist{color:#b91c1c;padding-left:20px}
  </style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>Django Web Push Demo</h1>
  <p>Bildirim aboneliğini test etmek için giriş yap.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label for="id_username">Kullanıcı adı</label>
    {{ form.username }}
    <label for="id_password">Şifre</label>
    {{ form.password }}
    <button type="submit">Giriş yap</button>
  </form>
</div></div>
</body>
</html>
